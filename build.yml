name: Build QuestHUDTracker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fill in vcpkg baselines
        shell: bash
        run: |
          VCPKG_HASH=$(git ls-remote https://github.com/microsoft/vcpkg HEAD | cut -f1)
          CG_HASH=$(git ls-remote https://gitlab.com/colorglass/vcpkg-colorglass HEAD | cut -f1)
          echo "vcpkg: $VCPKG_HASH  colorglass: $CG_HASH"
          sed -i "s/REPLACE_WITH_A_CURRENT_VCPKG_COMMIT_HASH/$VCPKG_HASH/; s/REPLACE_WITH_A_CURRENT_COLORGLASS_COMMIT_HASH/$CG_HASH/" vcpkg-configuration.json
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: cmake --preset release

      - name: Build
        shell: bash
        run: cmake --build --preset release

      - name: Package
        shell: bash
        run: |
          mkdir -p package/Data/SKSE/Plugins package/Data/Interface
          cp build/Release/QuestHUDTracker.dll package/Data/SKSE/Plugins/
          cp data/SKSE/Plugins/QuestHUDTracker.ini package/Data/SKSE/Plugins/
          cp data/Interface/QHT_QuestItemList.swf package/Data/Interface/

      - uses: actions/upload-artifact@v4
        with:
          name: QuestHUDTracker
          path: package
