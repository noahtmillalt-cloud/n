; QuestHUDTracker settings. Restart the game after changing anything here.

[General]
Enabled = 1
; swf  = use the quest list SWF (Data/Interface/QHT_QuestItemList.swf), looks like the vanilla list
; text = fallback, plain text field, needs no SWF
Mode = swf
MaxObjectives = 4
; How often the tracker re-reads the active quest, in milliseconds (minimum 100)
RefreshMs = 500

[Swf]
; File name inside Data/Interface
SwfPath = QHT_QuestItemList.swf
; Position and height as ratios of the screen (0 to 1)
SwfX = 0.03
SwfY = 0.25
SwfMaxHeight = 0.5
; 1 = let the HUD hide the list the way it hides other HUD parts (dialogue, swimming, horse)
RegisterHudElement = 1

[Text]
; Used only when Mode = text. Units are HUD stage units (1280x720, origin top-left).
X = 40
Y = 190
Width = 360
Height = 220
Opacity = 100
TitleSize = 24
ObjectiveSize = 22
; Colors are RRGGBB hex
TitleColor = DCC979
ObjectiveColor = EBEBEB
